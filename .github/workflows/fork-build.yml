name: Build Packages

run-name: "Build latest from ${{ inputs.ref || github.ref_name }}"

on:
  push:
    branches:
      - main
    # 纯文档改动不触发耗时的打包构建
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（留空则自动生成，例如 2026.47.8.auto.20261125）'
        required: false
        type: string
      ref:
        description: '要构建的分支、标签或提交'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build:
    name: Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      upstream: ${{ steps.version.outputs.upstream }}
      commit: ${{ steps.version.outputs.commit }}
      trigger: ${{ steps.version.outputs.trigger }}
    env:
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: '%compiler% -v'
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_FORCE_SYSTEM_BINARIES: '1'
      DEBIAN_FRONTEND: noninteractive

    steps:
      # The runner image ships ~15 GB of toolchains this build never uses. Reclaiming it matters: the
      # Distribution build (Qt via vcpkg + LTO + debug symbols) is disk hungry.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/az /usr/lib/google-cloud-sdk
          sudo docker image prune -af || true
          df -h /

      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Compute version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          upstream_url=https://github.com/LadybirdBrowser/ladybird.git
          upstream_sha=$(git ls-remote "$upstream_url" refs/heads/master | cut -f1)
          upstream_tag=$(git ls-remote --tags --refs "$upstream_url" \
            | awk -F/ '{ print $NF }' \
            | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          upstream_tag=${upstream_tag:-0.0.0}

          version=${VERSION_INPUT:-}
          if [ -z "$version" ]; then
            version="${upstream_tag}.auto.$(date -u +%Y%m%d)"
          fi

          commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=auto-latest" >> "$GITHUB_OUTPUT"
          echo "upstream=${upstream_tag}@${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "trigger=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "Building $version from ${commit:0:12} (upstream ${upstream_tag}@${upstream_sha:0:12})"

      - name: Add swap space
        run: |
          # The runner image may already have an active /swapfile, so use our own path and never fail the job here.
          sudo fallocate -l 8G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=8192
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra || echo "::warning::Could not enable the extra swap file"
          free -h

      - name: Prefer Clang 22
        run: |
          # The runner already provides a clang alternative (18), so update-alternatives keeps it.
          # Put LLVM 22 first in PATH before install-build-dependencies.sh runs its version check.
          sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++

      - name: Add GCC 14 toolchain
        run: |
          # Ubuntu 22.04 自带 GCC 12 的 libstdc++，而上游要求 libstdc++-14-dev。
          # 这里用 ubuntu-toolchain-r/test PPA 提供 GCC 14，其余依赖仍由上游脚本安装。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo --preserve-env=GITHUB_ENV,GITHUB_PATH,DEBIAN_FRONTEND \
            bash ./Meta/Docker/ci/install-build-dependencies.sh
          sudo apt-get install -y --no-install-recommends ccache
          clang --version

      - name: Set up Python environment
        run: |
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "PYTHON_BIN_DIR=$python_bin" >> "$GITHUB_ENV"
          echo "$python_bin" >> "$GITHUB_PATH"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: Build/caches/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-jammy-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-jammy-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-jammy-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-jammy-

      - name: Install vcpkg dependencies
        env:
          CC: /usr/bin/clang-22
          CXX: /usr/bin/clang++-22
        run: ./Meta/ladybird.py vcpkg --preset Distribution

      - name: Configure
        env:
          CC: /usr/bin/clang-22
          CXX: /usr/bin/clang++-22
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake --preset Distribution -B Build \
            -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            -DLADYBIRD_BUILD_QT=ON \
            -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF \
            -DPython3_EXECUTABLE="$PYTHON_BIN_DIR/python" \
            -DCMAKE_C_COMPILER=/usr/bin/clang-22 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-22 \
            "-DLADYBIRD_VERSION=${VERSION}"
          df -h /

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Build/caches/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-jammy-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build
        run: cmake --build Build

      - name: Install
        run: cmake --install Build --strip --prefix "$PWD/Install"

      - name: Package the Debian packages
        working-directory: Build
        run: |
          cpack -G DEB -B packages \
            -D CPACK_COMPONENTS_ALL="ladybird_Runtime;ladybird_SystemIntegration;ladybird_SystemSymbols"

      - name: Package the AppImage
        env:
          APPIMAGE_UPDATE_URL: ''
          VERSION: ${{ steps.version.outputs.version }}
        run: ./Meta/package-appimage.sh Build "$VERSION" x86_64 Build/packages

      - name: Write checksums
        working-directory: Build/packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GitHub 会把发布文件名里的 ~ 替换成 .，这里先统一改名，保证校验和与下载到的文件一致。
          for file in ./*.AppImage ./*.deb; do
            case "$file" in
              *'~'*) mv "$file" "${file//\~/.}" ;;
            esac
          done
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS.txt
          cp SHA256SUMS.txt "SHA256SUMS-$VERSION.txt"
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          TRIGGER: ${{ steps.version.outputs.trigger }}
        run: bash .github/scripts/release-notes.sh Build/packages > Build/packages/notes.md

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: Build/packages/*.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload the Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: Build/packages/*.deb
          if-no-files-found: error

      - name: Upload the checksums and release notes
        uses: actions/upload-artifact@v7
        with:
          name: metadata
          path: |
            Build/packages/SHA256SUMS.txt
            Build/packages/SHA256SUMS-*.txt
            Build/packages/notes.md
          if-no-files-found: error

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-jammy-${{ github.run_id }}

  verify:
    name: Verify packages
    needs: build
    uses: ./.github/workflows/fork-verify.yml
    with:
      version: ${{ needs.build.outputs.version }}

  release:
    name: Publish release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        working-directory: assets
        run: |
          set -euo pipefail
          ls -lh

          # needs: build 与 verify 已保证构建和测试都通过，这里再校验产物完整性。
          compgen -G './*.AppImage' > /dev/null
          compgen -G './ladybird_*.deb' > /dev/null
          compgen -G './ladybird-dbgsym_*.deb' > /dev/null
          test -s notes.md
          sha256sum -c SHA256SUMS.txt

          # 记录覆盖前的发布状态和资产列表，供提交阶段清理和失败回滚。
          created=0
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '{id,name,body,make_latest:"true"}' > ../old-release.json 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha' > ../old-tag-sha.txt 2>/dev/null || true
          else
            : > ../old-release.json
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > ../old-assets.txt 2>/dev/null || true
          echo "$created" > ../created-new.txt

          : > ../new-assets.txt
          for file in ./*.AppImage ./*.deb "./SHA256SUMS-$VERSION.txt" ./SHA256SUMS.txt; do
            basename "$file" >> ../new-assets.txt
          done

          # 第一次运行时创建固定标签的发布，之后一直复用同一个发布。
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ladybird $VERSION · 最新构建 / latest build" \
              --notes-file notes.md \
              --latest
            created=1
            echo "$created" > ../created-new.txt
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > ../old-assets.txt || true
          fi

          # 备份固定名的校验和，失败时可恢复；它作为提交点的一部分最后才覆盖。
          mkdir -p ../old-checksum
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'SHA256SUMS.txt' -D ../old-checksum 2>/dev/null || true

          # 先上传带版本号的新资产并核对，此时发布说明和标签仍指向上一次成功构建。
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = 'SHA256SUMS.txt' ] && continue
            gh release upload "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --clobber
          done < ../new-assets.txt

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > ../uploaded.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = 'SHA256SUMS.txt' ] && continue
            grep -qxF "$name" ../uploaded.txt || { echo "缺少资产 $name"; exit 1; }
          done < ../new-assets.txt

          # 提交点：覆盖校验和指针 -> 更新说明与标题 -> 移动固定标签 -> 删除旧资产。
          gh release upload "$TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ladybird $VERSION · 最新构建 / latest build" \
            --notes-file notes.md \
            --latest

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            jq -n --arg sha "$COMMIT" '{sha:$sha,force:true}' > ../ref-update.json
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              --input ../ref-update.json > /dev/null
          else
            jq -n --arg ref "refs/tags/$TAG" --arg sha "$COMMIT" \
              '{ref:$ref,sha:$sha}' > ../ref-update.json
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --input ../ref-update.json > /dev/null
          fi

          comm -23 <(sort ../old-assets.txt) <(sort ../new-assets.txt) \
            | while IFS= read -r name; do
                [ -n "$name" ] || continue
                gh release delete-asset "$TAG" "$name" \
                  --repo "$GITHUB_REPOSITORY" --yes || true
              done

          echo "最新构建发布已更新：$TAG -> $VERSION ($COMMIT)"

      - name: Restore the previous release on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd assets 2>/dev/null || exit 0

          # 恢复上一次发布的标题、说明和标签指向，然后删除本次新增的资产。
          if [ -s ../old-release.json ]; then
            id=$(jq -r .id ../old-release.json)
            jq 'del(.id)' ../old-release.json > ../restore-release.json
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              --input ../restore-release.json > /dev/null || true
          fi
          if [ -s ../old-tag-sha.txt ]; then
            sha=$(cat ../old-tag-sha.txt)
            jq -n --arg sha "$sha" '{sha:$sha,force:true}' > ../restore-ref.json
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              --input ../restore-ref.json > /dev/null || true
          fi
          if [ -f ../created-new.txt ] && [ "$(cat ../created-new.txt)" = 1 ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            exit 0
          fi
          if [ -f ../old-checksum/SHA256SUMS.txt ]; then
            gh release upload "$TAG" ../old-checksum/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber || true
          fi
          if [ -f ../old-assets.txt ] && [ -f ../new-assets.txt ]; then
            comm -23 <(sort ../new-assets.txt) <(sort ../old-assets.txt) \
              | while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  gh release delete-asset "$TAG" "$name" \
                    --repo "$GITHUB_REPOSITORY" --yes || true
                done
          fi
          echo "已回滚本次改动，保留上一次成功的最新构建发布"
