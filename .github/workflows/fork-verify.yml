name: Fork Verify

# 由 fork-build.yml 调用：静态检查 + 产物检查都通过，才允许发布到 auto-latest。
on:
  workflow_call:
    inputs:
      version:
        description: '本次构建的版本号'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  static:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Fork configuration
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/fork-build.yml \
            .github/workflows/fork-sync.yml \
            .github/workflows/fork-verify.yml \
            .github/scripts/release-notes.sh \
            .github/scripts/mirror-release.jq; do
            test -s "$f"
          done
          # 旧文件名不能回来（上游同步时可能带回来）
          for f in .github/workflows/build-packages.yml .github/workflows/sync-upstream.yml; do
            test ! -e "$f"
          done
          # 包名与版本号不能带发行版标识（注释里提到 Ubuntu 是允许的）
          grep -qF 'set(CPACK_DEBIAN_PACKAGE_RELEASE "1")' Meta/CMake/cpack_project_config.cmake
          if grep -qE 'set\(CPACK_DEBIAN_PACKAGE_RELEASE.*ubuntu' Meta/CMake/cpack_project_config.cmake; then
            echo "Debian release 号不应包含发行版标识"
            exit 1
          fi

      - name: Localization source
        run: |
          set -euo pipefail
          f=Base/res/ladybird/about-pages/i18n.js
          node --check "$f"
          count=$(grep -cE '^[[:space:]]*"[^"]+":[[:space:]]*"[^"]*"' "$f" || true)
          echo "译文条目数: $count"
          [ "$count" -ge 250 ]
          for key in 'About Ladybird' 'Settings' 'Bookmarks'; do
            grep -qF "\"$key\":" "$f"
          done
          grep -qF '真正独立的网页浏览器。' "$f"
          grep -qF 'document.documentElement.lang = "zh-CN"' "$f"

      - name: Documentation links
        run: |
          set -euo pipefail
          grep -qF 'tree/main' README.md
          grep -qF 'releases/tag/auto-latest' README.md
          grep -qF 'actions/workflows/fork-build.yml' README.md
          if grep -qE 'auto-daily|auto-build' README.md; then
            echo "README 中仍有旧分支或旧标签引用"
            exit 1
          fi

  packages:
    name: Package checks
    runs-on: ubuntu-24.04
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Package names, checksums and Debian metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd assets
          ls -lh

          app=$(find . -maxdepth 1 -name '*.AppImage' -printf '%f\n')
          deb=$(find . -maxdepth 1 -name 'ladybird_*.deb' ! -name 'ladybird-dbgsym_*' -printf '%f\n')
          dbg=$(find . -maxdepth 1 -name 'ladybird-dbgsym_*.deb' -printf '%f\n')
          [ -n "$app" ] && [ -n "$deb" ] && [ -n "$dbg" ]
          total=$(find . -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)
          [ "$total" -eq 3 ]
          [ "$app" = "ladybird-${VERSION}-Linux-x86_64.AppImage" ]
          [ "$deb" = "ladybird_${VERSION}-1_amd64.deb" ]
          [ "$dbg" = "ladybird-dbgsym_${VERSION}-1_amd64.deb" ]
          if printf '%s\n' "$app" "$deb" "$dbg" | grep -qi 'ubuntu'; then
            echo "发布包文件名不应包含发行版标识"
            exit 1
          fi

          test -s SHA256SUMS.txt
          test -s "SHA256SUMS-${VERSION}.txt"
          cmp -s SHA256SUMS.txt "SHA256SUMS-${VERSION}.txt"
          sha256sum -c SHA256SUMS.txt

          ver=$(dpkg-deb -f "$deb" Version)
          [ "$ver" = "${VERSION}-1" ]
          deps=$(dpkg-deb -f "$deb" Depends)
          printf '%s\n' "$deps" | grep -q 'libc6'
          if printf '%s\n' "$deps" | grep -q '2.39'; then
            echo "主包依赖了 glibc 2.39"
            exit 1
          fi
          dbgdep=$(dpkg-deb -f "$dbg" Depends)
          [ "$dbgdep" = "ladybird (= ${VERSION}-1)" ]
          dpkg-deb -c "$dbg" | grep -q '/usr/lib/debug/.build-id/'

          [ "$(stat -c %s "$app")" -gt 104857600 ]
          [ "$(stat -c %s "$deb")" -gt 52428800 ]
          [ "$(stat -c %s "$dbg")" -gt 52428800 ]

      - name: glibc compatibility
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd assets
          app="ladybird-${VERSION}-Linux-x86_64.AppImage"
          chmod +x "$app"

          max_strings=$( (strings "$app" | grep -oE 'GLIBC_2\.[0-9]{1,2}(\.[0-9]+)?' \
            | sed -E 's/^GLIBC_2\.([0-9]+).*/\1/' | sort -n | tail -1) || true )
          ./"$app" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/Ladybird
          max_elf=$( (find squashfs-root -type f -perm /111 -print0 \
            | xargs -0 -r file \
            | awk -F': ' '/ELF/{print $1}' \
            | while IFS= read -r f; do readelf --version-info "$f" 2>/dev/null || true; done \
            | grep -oE 'GLIBC_2\.[0-9]{1,2}(\.[0-9]+)?' \
            | sed -E 's/^GLIBC_2\.([0-9]+).*/\1/' | sort -n | tail -1) || true )

          if [ -z "$max_strings" ] && [ -z "$max_elf" ]; then
            echo "没有找到任何 glibc 版本信息，无法确认兼容性"
            exit 1
          fi
          for v in "$max_strings" "$max_elf"; do
            [ -n "$v" ] || continue
            echo "检测到最高 glibc 次版本: 2.$v"
            if [ "$v" -gt 35 ]; then
              echo "要求 glibc 2.$v，高于目标 2.35"
              exit 1
            fi
          done

      - name: Localization in the AppImage
        run: |
          set -euo pipefail
          cd assets
          i18n=squashfs-root/usr/share/Lagom/ladybird/about-pages/i18n.js
          test -s "$i18n"
          grep -qF 'zh-CN' "$i18n"
          grep -qF '真正独立的网页浏览器。' "$i18n"
          for s in '设置' '书签' '新标签页'; do
            grep -aq "$s" squashfs-root/usr/bin/Ladybird
          done
          echo "中文界面资源与字符串检查通过"
